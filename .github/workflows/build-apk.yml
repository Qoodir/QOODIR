name: Build Android APK
  run: npm run build  # Sesuaikan dengan skrip build Anda (misal: npm run build atau vite build)
  
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Install Capacitor CLI Globally
      run: npm install -g @capacitor/cli @capacitor/core

    - name: Initialize Project Configurations
      run: |
        if [ ! -f package.json ]; then
          echo '{"name": "qoodir-app", "version": "1.0.0", "dependencies": {"@capacitor/core": "^6.0.0"}, "devDependencies": {"@capacitor/cli": "^6.0.0", "@capacitor/android": "^6.0.0"}}' > package.json
        fi
        if [ ! -f capacitor.config.json ]; then
          echo '{"appId": "com.qoodir.app", "appName": "QoodirApp", "webDir": ".", "bundledWebRuntime": false}' > capacitor.config.json
        fi

    - name: Install Local Dependencies
      run: npm install

    - name: Create Android Folder
      run: npx cap add android

    - name: Inject Web Assets
      run: npx cap sync android

    - name: Build APK with Gradle
      run: |
        cd android
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
